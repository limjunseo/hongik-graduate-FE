name: Frontend CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and build
        run: npm run build
  windows-bootstrap-and-ui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Validate bootstrap syntax and dry run
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path .\bootstrap.ps1).Path, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }
          & .\bootstrap.ps1 -DryRun
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Install frontend dependencies
        run: npm ci
      - name: Visual smoke on desktop and mobile
        shell: pwsh
        run: |
          $dev = Start-Process -FilePath cmd.exe -ArgumentList '/c', 'npm.cmd run dev' -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            foreach ($attempt in 1..45) {
              try {
                $response = Invoke-WebRequest 'http://127.0.0.1:5173/login' -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $ready) { throw 'Frontend did not become ready.' }
            npm run test:ui
            if ($LASTEXITCODE -ne 0) { exit 1 }
          } finally {
            Stop-Process -Id $dev.Id -Force -ErrorAction SilentlyContinue
          }
